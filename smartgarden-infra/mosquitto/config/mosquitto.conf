listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# O backend usa sessão persistente (cleanSession=false). Com isto o broker guarda as leituras
# (QoS 0) enquanto o backend está reiniciando e entrega quando ele volta, em vez de descartar.
queue_qos0_messages true
max_queued_messages 3000
