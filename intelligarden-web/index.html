<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IntelliGarden 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: palco 3D em tela cheia, a sala é uma maquete branca com paredes cortadas (poché escuro) e as plantas são a única cor.
   Topo: marca + leitura do sensor. Base: dock com vista e plantas. Ficha da planta desliza da direita (folha inferior no celular). */
:root {
  --bg: #E4E9E3;
  --bg-hi: #F4F6F2;
  --glass: rgba(255, 255, 255, 0.8);
  --surface: #FFFFFF;
  --surface-2: #F1F4F0;
  --surface-3: #E6EBE5;
  --ink: #15201A;
  --muted: #5B675F;
  --line: #E0E6DF;
  --leaf: #2D6B48;
  --water: #2463A8;
  --warn: #B87414;
  --warn-ink: #85520A;
  --scrim: rgba(14, 20, 16, 0.42);
  --shadow-1: 0 1px 2px rgba(21, 32, 26, 0.06), 0 8px 24px rgba(21, 32, 26, 0.1);
  --shadow-2: 0 2px 6px rgba(21, 32, 26, 0.06), 0 24px 60px rgba(21, 32, 26, 0.16);
  --is-dark: 0;
  --f-display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --sheet-w: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1210; --bg-hi: #1A221D; --glass: rgba(24, 30, 26, 0.8);
    --surface: #161C18; --surface-2: #1F2722; --surface-3: #29322C;
    --ink: #E6ECE7; --muted: #98A49C; --line: #28312B;
    --leaf: #6DC193; --water: #7AB3EE; --warn: #E3AF4F; --warn-ink: #EDC37A;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 24px 60px rgba(0, 0, 0, 0.55);
    --is-dark: 1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1210; --bg-hi: #1A221D; --glass: rgba(24, 30, 26, 0.8);
  --surface: #161C18; --surface-2: #1F2722; --surface-3: #29322C;
  --ink: #E6ECE7; --muted: #98A49C; --line: #28312B;
  --leaf: #6DC193; --water: #7AB3EE; --warn: #E3AF4F; --warn-ink: #EDC37A;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.45);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 24px 60px rgba(0, 0, 0, 0.55);
  --is-dark: 1; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
p { margin: 0; }

.app { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 95% at 50% 36%, var(--bg-hi) 0%, var(--bg) 64%); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#scene.is-over { cursor: pointer; }
#scene.is-drag { cursor: grabbing; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); pointer-events: none; transition: opacity 0.6s; }
.loading.done { opacity: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* Marcadores sobre as plantas */
#markers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mk { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.mk-btn { position: absolute; left: -18px; top: -18px; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; pointer-events: auto; transition: opacity 0.25s, visibility 0s; }
.mk-dot { position: relative; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--surface), 0 3px 10px rgba(0, 0, 0, 0.28); transition: transform 0.3s var(--ease); }
.mk-btn:hover .mk-dot, .mk.is-hot .mk-dot { transform: scale(1.3); }
.mk.st-water .mk-dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--water); animation: ripple 2.4s ease-out infinite; }
@keyframes ripple { from { transform: scale(1); opacity: 0.85; } to { transform: scale(2.6); opacity: 0; } }
.mk-label { position: absolute; left: 32px; top: 50%; display: flex; align-items: baseline; gap: 8px; padding: 7px 11px; border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); font-size: 13px; font-weight: 500; white-space: nowrap; opacity: 0; transform: translate(-6px, -50%); transition: opacity 0.2s, transform 0.3s var(--ease); pointer-events: none; }
.mk-label b { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mk.flip .mk-label { left: auto; right: 32px; transform: translate(6px, -50%); }
.mk-btn:hover .mk-label, .mk-btn:focus-visible .mk-label, .mk.is-hot .mk-label { opacity: 1; transform: translate(0, -50%); }
.mk.is-off .mk-btn { opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0s 0.25s; }
.st-ok { --c: var(--leaf); }
.st-warn { --c: var(--warn); }
.st-water { --c: var(--water); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

/* Topo */
.top { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); right: calc(20px + env(safe-area-inset-right, 0px)); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; pointer-events: none; animation: rise 0.8s var(--ease) 1.5s backwards; }
.top > * { pointer-events: auto; }
.brand-name { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 23px; line-height: 1; letter-spacing: -0.02em; }
.brand-name svg { width: 20px; height: 20px; color: var(--leaf); flex: none; }
.brand-meta { margin-top: 7px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sensor { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; transition: opacity 0.3s, transform 0.5s var(--ease), background-color 0.2s; }
.sensor:hover { background: var(--surface); }
.sensor .live { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 0 3px color-mix(in srgb, var(--leaf) 25%, transparent); }
.sensor .faint { color: var(--muted); }
.app.has-sheet .sensor { opacity: 0; pointer-events: none; transform: translateY(-8px); }

/* Dock */
.dock { position: absolute; left: 0; right: 0; margin-inline: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 18px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--shadow-1); transition: transform 0.55s var(--ease), opacity 0.3s; animation: rise 0.8s var(--ease) 1.7s backwards; }
.app.has-sheet .dock { transform: translateY(calc(100% + 48px)); opacity: 0; pointer-events: none; }
.views { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--surface-2); flex: none; }
.views button { height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; transition: background-color 0.2s, color 0.2s, box-shadow 0.2s; }
.views button svg { width: 16px; height: 16px; flex: none; }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--line); }
.plist { display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; min-width: 0; scroll-snap-type: x proximity; }
.plist::-webkit-scrollbar { display: none; }
.pbtn { display: flex; flex-direction: column; justify-content: center; gap: 6px; width: 124px; height: 48px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; text-align: left; scroll-snap-align: start; transition: background-color 0.2s; }
.pbtn:hover, .pbtn.is-hot { background: var(--surface-2); }
.pb-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pb-low { display: flex; align-items: center; gap: 8px; }
.pb-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-pct { min-width: 30px; text-align: right; font-family: var(--f-mono); font-size: 11px; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
.pb-bar { position: relative; flex: 1; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.pb-bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--water); }

/* Dica */
.hint { position: absolute; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 32px); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding: 7px 14px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--muted); font-size: 12.5px; text-align: center; opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.5s var(--ease); pointer-events: none; }
.hint.show { opacity: 1; transform: none; }
.app.has-sheet .hint { opacity: 0; }

/* Ficha */
.sheet { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 32px)); display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-2); transform: translateX(calc(100% + 40px)); transition: transform 0.6s var(--ease); outline: none; }
.sheet.open { transform: none; }
.s-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 0 14px; }
.s-nav { display: flex; align-items: center; gap: 2px; }
.s-count { min-width: 36px; text-align: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.s-kicker { padding-left: 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ibtn { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--ink); display: grid; place-items: center; transition: background-color 0.2s; }
.ibtn:hover { background: var(--surface-2); }
.ibtn svg { width: 18px; height: 18px; }
.s-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 24px 24px; display: flex; flex-direction: column; gap: 26px; }
.s-id { display: flex; flex-direction: column; gap: 4px; }
.s-status { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.s-title { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
.s-sci { font-size: 14px; font-style: italic; color: var(--muted); }
.s-spot { margin-top: 6px; font-size: 13px; color: var(--muted); }
.lbl { margin-bottom: 10px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.s-big { display: flex; align-items: baseline; gap: 4px; font-family: var(--f-display); font-weight: 500; font-size: 60px; line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.s-unit { font-size: 26px; color: var(--muted); }
.gauge { position: relative; height: 10px; margin-top: 16px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.gauge-fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--water); }
.gauge-limit { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.gauge-scale { position: relative; height: 18px; margin-top: 7px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.gauge-scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.s-text { margin-top: 12px; font-size: 14px; line-height: 1.55; color: var(--ink); }
.s-text.muted { color: var(--muted); }
.climate { margin: 0; display: flex; flex-direction: column; }
.climate > div { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 3px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.climate > div:first-child { padding-top: 0; border-top: 0; }
.climate dt { font-size: 14px; }
.climate dd { margin: 0; font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.climate .range { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.range svg { width: 14px; height: 14px; flex: none; }
.range.ok svg { color: var(--leaf); }
.range.bad { color: var(--warn-ink); }
.range.bad svg { color: var(--warn); }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
.log li { display: grid; grid-template-columns: 8px 1fr; gap: 12px; }
.ldot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--muted); }
.ev-rega .ldot, .ev-irrigacao .ldot { background: var(--water); }
.ev-pesagem .ldot { background: var(--ink); }
.ev-alerta .ldot { background: var(--warn); }
.ev-obs .ldot { background: var(--leaf); }
.l-t { font-size: 14px; font-weight: 500; }
.l-d { margin-top: 2px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.l-when { font-family: var(--f-mono); font-size: 11.5px; }
.l-photo { margin-top: 8px; width: 72px; height: 72px; object-fit: cover; border-radius: 10px; }
.s-fine { padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.5; color: var(--muted); }
.s-foot { flex: none; display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--surface); }
.reads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.reads > div { padding: 12px; border-radius: 12px; background: var(--surface-2); }
.reads .lbl { margin-bottom: 6px; font-size: 10px; }
.read { font-family: var(--f-display); font-weight: 500; font-size: 26px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.read small { margin-left: 3px; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.facts { margin: 14px 0 0; display: flex; flex-direction: column; }
.facts > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; }

/* Botões */
.btn { flex: 1; height: 46px; padding: 0 16px; border: 0; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: background-color 0.2s, transform 0.12s, opacity 0.2s; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: default; transform: none; }
.btn-primary { background: var(--ink); color: var(--surface); }
.btn-primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--surface)); }
.btn-soft { background: var(--surface-2); color: var(--ink); }
.btn-soft:hover { background: var(--surface-3); }
.btn-soft .i-water { color: var(--water); }

/* Registro (modal) */
dialog.reg { width: min(480px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 0; border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3); overflow: hidden; }
dialog.reg[open] { display: flex; flex-direction: column; animation: dlg-in 0.36s var(--ease); }
dialog.reg::backdrop { background: var(--scrim); animation: fade-in 0.3s ease; }
dialog.reg.closing { animation: dlg-out 0.18s ease-in forwards; }
dialog.reg.closing::backdrop { animation: fade-out 0.18s ease-in forwards; }
@keyframes dlg-in { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes dlg-out { to { opacity: 0; transform: translateY(10px) scale(0.985); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
.reg form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.reg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 14px 4px 24px; }
.reg-head .lbl { margin-bottom: 4px; }
.reg-title { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; margin: 14px 24px 0; padding: 3px; border-radius: 13px; background: var(--surface-2); }
.seg button { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; transition: background-color 0.2s, color 0.2s; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--line); }
.reg-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 22px; }
.reg-body section { display: flex; flex-direction: column; gap: 10px; }
.field-l { font-size: 14px; font-weight: 500; }
.big-in { display: flex; align-items: baseline; gap: 8px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color 0.2s; }
.big-in:focus-within { border-color: var(--ink); }
.big-in input { flex: 1; min-width: 0; height: 64px; border: 0; outline: none; background: transparent; font-family: var(--f-display); font-weight: 500; font-size: 34px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big-in span { font-family: var(--f-mono); color: var(--muted); }
.help { font-size: 13px; line-height: 1.5; color: var(--muted); }
.compare { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); }
.compare strong { font-size: 15px; font-weight: 600; }
.compare span { font-size: 13.5px; color: var(--muted); }
.compare.warn strong { color: var(--warn-ink); }
.err { font-size: 13px; font-weight: 500; color: var(--warn-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 500; transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
.chip:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; font-size: 14px; }
.sm-in { display: flex; align-items: center; gap: 6px; width: 132px; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; }
.sm-in:focus-within { border-color: var(--ink); }
.sm-in input { width: 100%; min-width: 0; border: 0; outline: none; background: transparent; font-family: var(--f-mono); }
.sm-in span { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--leaf); }
textarea.txt { min-height: 88px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); resize: vertical; outline: none; }
textarea.txt:focus { border-color: var(--ink); }
.photo-row { display: flex; align-items: center; gap: 12px; }

  const ctrl = new AbortController();

  if (w === 'hoje' || w === 'ontem') return `${w}, ${hhmm(d)}`;
  const days = Math.round((dayStart(new Date()) - dayStart(d)) / 864e5);
  return days < 30 ? `há ${days} dias` : d.toLocaleDateString('pt-BR');
}
function agoText() {
  if (!live.readingAt) return 'sem leitura';
  const s = Math.max(0, Math.round((Date.now() - live.readingAt) / 1000));
  if (s < 5) return 'agora';
  if (s < 90) return `há ${s} s`;
  if (s < 5400) return `há ${Math.round(s / 60)} min`;
  return whenText(live.readingAt);
}
function nextText(p) {
  const d = p.api;
  if (!d) return `Próxima irrigação: ${p.next}.`;
  if (d.needsWater || d.hoursToThreshold === 0) {
    return p.auto ? 'Chegou ao limite: a irrigação simulada dispara na próxima leitura do sensor.' : 'Chegou ao limite: regue e registre a rega.';
  }
  const what = p.auto ? 'Próxima irrigação automática' : 'Próxima rega';
  const h = d.hoursToThreshold;
  if (h == null) return `${what}: sem previsão com o clima de agora.`;
  const at = new Date(Date.parse(d.estimatedAt) + h * 3600e3);
  at.setMinutes(Math.round(at.getMinutes() / 10) * 10, 0, 0);
  let when;
  if (h < 1) when = `em cerca de ${Math.max(5, Math.round(h * 12) * 5)} min`;
  else if (h < 40 && dayWord(at)) when = `${dayWord(at)}, por volta das ${hhmm(at)}`;
  else when = `em cerca de ${Math.max(2, Math.round(h / 24))} dias`;
  return `${what}: ${when}, se o clima continuar assim.`;
}
function noteText(p) {
  const d = p.api;
  if (!d) return p.note;
  const out = [];
  if (p.water <= p.limit) out.push(p.auto ? 'A água estimada chegou ao limite.' : 'A água estimada chegou ao limite. Como é um vaso real, a equipe rega e registra.');
  if (CLIMATE.temp == null) {
    out.push('Ainda sem leitura do sensor.');
  } else {
    const [hLo, hHi] = p.rh, [tLo, tHi] = p.temp;
    if (hLo != null && CLIMATE.rh < hLo) out.push(`O ar está mais seco do que ela gosta (ideal a partir de ${fmtN(hLo, 0)} %).`);
    else if (hHi != null && CLIMATE.rh > hHi) out.push(`O ar está mais úmido do que ela gosta (ideal até ${fmtN(hHi, 0)} %).`);
    if (tLo != null && CLIMATE.temp < tLo) out.push(`Está mais frio do que ela gosta (ideal a partir de ${fmtN(tLo, 0)} °C).`);
    else if (tHi != null && CLIMATE.temp > tHi) out.push(`Está mais quente do que ela gosta (ideal até ${fmtN(tHi, 0)} °C).`);
    if (out.length === 0) out.push('Clima bom para ela.');
  }
  if (d.lossMlPerHour != null) out.push(`Com o clima de agora, o vaso perde cerca de ${fmtN(d.lossMlPerHour, 1)} mL de água por hora.`);
  return out.join(' ');
}
function fineText(p) {
  const base = 'A água no vaso é estimada pelo clima, sem sensor no solo. A irrigação é simulada.';
  const d = p.api;
  if (!d) return `${base} Dados de exemplo, sem servidor.`;
  if (!d.calibrationSamples) return `${base} Ainda sem pesagens para conferir a estimativa.`;
  const n = d.calibrationSamples;
  let t = ` Conferida com ${n} ${n === 1 ? 'pesagem' : 'pesagens'}`;
  if (d.meanErrorPercent != null) t += `: erro médio de ${fmtN(d.meanErrorPercent, 0)} %`;
  if (d.suggestedCoefficient != null) t += `. Coeficiente de perda sugerido ${fmtN(d.suggestedCoefficient, 2)} (em uso: ${fmtN(d.lossCoefficient, 2)})`;
  return `${base}${t}.`;
}
function eventOf(r) {
  const when = whenText(r.recordedAt);
  if (r.type === 'weighing') {
    let detail;
    if (r.fullPot) detail = 'vaso cheio, virou a referência';
    else if (r.measuredLossMl != null) detail = r.measuredLossMl > 0 ? `perdeu ${fmtInt(r.measuredLossMl)} mL, o sistema estimou ${fmtInt(r.estimatedLossMl)} mL` : 'mais pesado que na pesagem anterior';
    else detail = 'sem comparação: primeira pesagem ou houve rega antes';
    if (!r.fullPot && r.measuredWaterPercent != null) detail += ` · balança: ${Math.round(r.measuredWaterPercent)} % de água`;
    return { type: 'pesagem', title: `Pesagem: ${fmtInt(r.weightGrams)} g`, detail, when };
  }
  if (r.type === 'watering') return { type: 'rega', title: `Rega: ${fmtInt(r.waterMl)} mL`, detail: r.drained ? 'feita pela equipe, escorrida' : 'feita pela equipe, sem confirmar o escoamento', when };
  if (r.type === 'irrigation') {
    return { type: 'irrigacao', title: `Irrigação ${r.automatic ? 'automática' : 'acionada'}: ${fmtInt(r.waterMl)} mL`,
      detail: r.automatic ? `simulada, chegou ao limite (${Math.round(r.estimatedWaterPercent)} %)` : 'simulada pela interface', when };
  }
  return { type: 'obs', title: 'Observação', detail: r.note || '', when };
}

/* ---------------- dados ao vivo ---------------- */
function applyApi(p, d, animate = true) {
  p.api = d;
  p.name = d.name || p.name;
  p.sci = d.scientificName || p.sci;
  p.spot = d.spot || p.spot;
  p.limit = d.irrigationThresholdPercent;
  p.temp = [d.temperatureMinC, d.temperatureMaxC];
  p.rh = [d.humidityMinPercent, d.humidityMaxPercent];
  p.recommend = d.irrigationMl;
  p.lastWeight = d.lastWeightG;
  p.estSince = d.estimatedLossSinceWeighingMl;
  p.auto = d.autoIrrigation;
  const w = clamp(d.estimatedWaterPercent, 0, 100);
  const cur = p.waterAnim ? p.waterAnim.to : p.water;
  if (!animate) { p.water = w; p.waterAnim = null; }
  else if (Math.abs(w - cur) > 0.05) animateWater(p, w, Math.abs(w - cur) > 5 ? 1500 : 800);
  refreshPlantUI(p, true);
  refreshSheetText(p);
}
function addRecord(p, r) {
  if (!p.records || p.records.some((x) => x.id === r.id)) return;
  p.records.unshift(r);
  refreshLog(p);
}
async function loadRecords(p) {
  if (!live.on) return;
  try {
    p.records = await api(plantPath(p, '/records?limit=6'));
    p.recordsErr = null;
  } catch (err) {
    p.recordsErr = err.message;
  }
  refreshLog(p);
}
function onReading(r) {
  const at = Date.parse(r.recordedAt);
  if (live.readingAt && at < live.readingAt) return;
  live.readingAt = at;
  CLIMATE.temp = Number(r.temperatureC);
  CLIMATE.rh = Number(r.humidityPercent);
  CLIMATE.vpd = vpdOf(CLIMATE.temp, CLIMATE.rh);
  climateChanged();
}
function onDevice(d) {
  live.device = d;
  renderSensor();
  refreshSensorSheet();
}
function climateChanged() {
  renderSensor();
  for (const p of plants) refreshPlantUI(p);
  if (byId[selectedId]) refreshSheetText(byId[selectedId]);
  refreshSensorSheet();
}
const ledSecondsFor = (ml) => clamp(Math.round(ml / 10), 1, 60);
function canIrrigate(p) { return !!p && !rain && !live.irrigating && (!p.api || p.auto); }
function showRain(p) {
  p.obj.wet = 1;
  if (rain) return;
  rain = { p, until: performance.now() + 2400 };

  if (b) b.disabled = true;
}
/* Irrigação vinda do servidor: automática (pelo sensor) ou pedida aqui. Chega pela resposta e pelo SSE; vale uma vez. */
function onIrrigated(d, r) {
  const p = byId[d.code];
  if (!p || !plants.includes(p) || live.seen.has(r.id)) return;
  live.seen.add(r.id);
  showRain(p);
  applyApi(p, d);
  addRecord(p, r);
  const s = ledSecondsFor(r.waterMl);
  ledOnUntil = performance.now() + s * 1000;
  toast(`${r.automatic ? 'Irrigação automática' : 'Irrigação acionada'} · ${p.name}`,
    sensorOnline() ? `${fmtInt(r.waterMl)} mL · LED do IG-01 aceso por ${s} s` : `${fmtInt(r.waterMl)} mL · IG-01 offline, o LED não acende agora`, 'water');
}

async function loadAll() {
  const dev = encodeURIComponent(DEVICE);
  const [list, device, reading] = await Promise.all([
    api(`/api/plants?deviceCode=${dev}`),
    api(`/api/devices/${dev}`).catch(() => null),
    api(`/api/readings/latest?deviceCode=${dev}`).catch(() => null)
  ]);
  return { list, device, reading };
}
function applyAll({ list, device, reading }, animate) {
  for (const d of list) {
    const p = byId[d.code];
    if (p && plants.includes(p)) applyApi(p, d, animate);
  }
  if (device) onDevice(device);
  if (reading) onReading(reading);
}
async function boot() {
  let data = null, why = 'Modo de exemplo pedido no endereço (?demo).';
  if (!QS.has('demo')) {
    try {
      data = await loadAll();
      if (!data.list.some((d) => byId[d.code])) throw new Error(`Nenhuma planta da maquete está cadastrada para o sensor ${DEVICE}.`);
    } catch (err) {
      data = null;
      why = err.message;
    }
  }
  if (data) startLive(data); else startDemo(why);
  booted = true;
  for (const p of plants) refreshPlantUI(p, true);
  renderSensor();
}
function startLive(data) {
  live.on = true;
  live.conn = true;
  /* pode vir do exemplo (o servidor voltou): limpa o clima de exemplo antes de aplicar o real */
  Object.assign(CLIMATE, { temp: null, rh: null, vpd: null });
  live.readingAt = null;
  $('#demo-tag').hidden = true;
  const codes = new Set(data.list.map((d) => d.code));
  for (const p of [...plants]) if (!codes.has(p.id)) dropPlant(p);
  for (const d of data.list) if (!byId[d.code]) console.info(`IntelliGarden: a planta ${d.code} não tem modelo na maquete e fica fora do 3D.`);
  applyAll(data, false);
  $('#plant-count').textContent = `${plants.length} ${plants.length === 1 ? 'planta' : 'plantas'}`;
  connectStream();
  climateChanged();
  const p = byId[selectedId];
  if (p && plants.includes(p)) { renderSheet(plantSheet(p)); loadRecords(p); }
  else if (p) back();
  else if (selectedId === 'sensor') renderSheet(sensorSheet());
}
function startDemo(why) {
  console.info(`IntelliGarden: dados de exemplo. ${why}`);
  Object.assign(CLIMATE, { temp: 25.5, rh: 45, vpd: vpdOf(25.5, 45) });
  live.readingAt = Date.now() - 12e3;
  $('#demo-tag').hidden = false;
  if (QS.has('demo')) return;
  setTimeout(() => toast('Mostrando dados de exemplo', why, 'warn'), reduce ? 400 : 3200);
  /* continua tentando: se o servidor subir depois, a página passa para os dados reais sozinha */
  const retry = async () => {
    try {
      const data = await loadAll();
      if (!data.list.some((d) => byId[d.code])) throw new Error('sem plantas da maquete');
      startLive(data);
      toast('Conectado ao servidor', 'Agora a página mostra os dados reais', 'ok');
    } catch {
      setTimeout(retry, 15000);
    }
  };
  setTimeout(retry, 15000);
}
/* planta da maquete que não existe no servidor: some da sala, da lista e das setas */
function dropPlant(p) {
  plants.splice(plants.indexOf(p), 1);
  p.group.visible = false;
  dockEls[p.id].parentElement.remove();
  mkEls[p.id].remove();
}

let stream = null, streamRetry = null;
function connectStream() {
  clearTimeout(streamRetry);
  if (stream) stream.close();
  stream = new EventSource(`${API}/api/events/readings?deviceCode=${encodeURIComponent(DEVICE)}`);
  const on = (name, fn) => stream.addEventListener(name, (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }
    fn(data);
  });
  stream.addEventListener('connected', () => {
    live.conn = true;
    if (live.lost) { live.lost = false; resync(); }
    renderSensor();
    refreshSensorSheet();
  });
  on('reading-created', onReading);
  on('device-status', onDevice);
  on('plants-updated', (list) => list.forEach((d) => { const p = byId[d.code]; if (p && plants.includes(p)) applyApi(p, d); }));
  on('plant-irrigated', (d) => onIrrigated(d.plant, d.record));
  stream.onerror = () => {
    live.conn = false;
    live.lost = true;
    renderSensor();
    refreshSensorSheet();
    /* o navegador reconecta sozinho; se ele desistir (resposta inválida), tenta de novo em 5 s */
    if (stream.readyState === EventSource.CLOSED) streamRetry = setTimeout(connectStream, 5000);
  };
}
/* depois de uma queda do SSE, busca tudo de novo para não ficar com dado velho */
async function resync() {
  try {
    applyAll(await loadAll(), true);
    const p = byId[selectedId];
    if (p) loadRecords(p);
  } catch {
    /* a próxima reconexão tenta de novo */
  }
}

const matCache = new Map();

function box(parent, sx, sy, sz, x, y, z, material, shadow = true) {

function canvasTex(w, h, draw, repeat) {

/* curva um eixo reto (comprimento em +Y) num arco, sem esticar: o comprimento se mantém */
function arc(s, z0, len, curl) {
  if (Math.abs(curl) < 1e-4) return [s, z0];
  const R = len / curl, a = s / R;
  return [R * Math.sin(a) - z0 * Math.sin(a), R * (1 - Math.cos(a)) + z0 * Math.cos(a)];
}
/* folha a partir de um retângulo: largura pelo perfil, dobra no meio (cup), torção e arco */
function leafGeo(len, wid, profile, curl, twist = 0, segX = 4, segY = 12, cup = 0.25, lobe = 0) {
  const g = new THREE.PlaneGeometry(1, 1, segX, segY);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + 0.5, v = p.getY(i) + 0.5;
    const e = (u - 0.5) * 2, w = profile(v) * wid;
    const x = e * w;
    const s = v * len - lobe * e * e * Math.pow(1 - v, 3) * len * 0.3;
    const z0 = -cup * e * e * w;
    const a = twist * v;
    const xr = x * Math.cos(a) - z0 * Math.sin(a), zr = x * Math.sin(a) + z0 * Math.cos(a);
    const [y, z] = arc(s, zr, len, curl);
    p.setXYZ(i, xr, y, z);
  }
  g.computeVertexNormals();
  return g;
}

/* sombras de contato e cantos (gradientes suaves, baratos e estáveis) */

const aoDown = softTex((g, w, h) => { const l = g.createLinearGradient(0, 0, 0, h); l.addColorStop(0, 'rgba(255,255,255,1)'); l.addColorStop(0.3, 'rgba(255,255,255,0.42)'); l.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = l; g.fillRect(0, 0, w, h); });

function skyTex(night) {
  return canvasTex(1024, 640, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    if (night) { gr.addColorStop(0, '#0C1628'); gr.addColorStop(0.7, '#1A2A44'); gr.addColorStop(1, '#27344E'); }
    else { gr.addColorStop(0, '#9CC6EA'); gr.addColorStop(0.6, '#D3E6F1'); gr.addColorStop(1, '#EDF1E8'); }
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (night) {
      for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.6})`; const s = rnd() < 0.15 ? 2.2 : 1.4; g.fillRect(rnd() * w, rnd() * h * 0.55, s, s); }
      const mg = g.createRadialGradient(w * 0.72, h * 0.16, 0, w * 0.72, h * 0.16, 70);
      mg.addColorStop(0, 'rgba(240,244,255,0.95)'); mg.addColorStop(0.18, 'rgba(240,244,255,0.9)'); mg.addColorStop(0.22, 'rgba(200,215,255,0.25)'); mg.addColorStop(1, 'rgba(200,215,255,0)');
      g.fillStyle = mg; g.fillRect(0, 0, w, h);
    } else {
      for (let i = 0; i < 8; i++) {
        const x = rnd() * w, y = 50 + rnd() * 190, s = 50 + rnd() * 80;
        g.save(); g.translate(x, y); g.scale(2.4, 0.55);
        const rg = g.createRadialGradient(0, 0, 0, 0, 0, s);
        rg.addColorStop(0, 'rgba(255,255,255,0.6)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = rg; g.beginPath(); g.arc(0, 0, s, 0, Math.PI * 2); g.fill(); g.restore();
      }
    }
    const base = h * 0.8;
    let x = -10;
    while (x < w) {
      const bw = 34 + rnd() * 80, bh = 24 + rnd() * 110;
      g.fillStyle = night ? '#22304A' : 'rgba(150, 172, 184, 0.5)';
      g.fillRect(x, base - bh, bw, bh + 300);
      if (night) { g.fillStyle = 'rgba(255, 210, 140, 0.75)'; for (let k = 0; k < 8; k++) if (rnd() < 0.45) g.fillRect(x + 4 + rnd() * (bw - 10), base - bh + 8 + rnd() * (bh - 14), 3, 4); }
      x += bw + 6 + rnd() * 26;
    }
    const palm = (px, py, ph, s) => {
      g.strokeStyle = night ? '#18233A' : 'rgba(112, 136, 118, 0.85)';
      g.fillStyle = g.strokeStyle;
      g.lineWidth = 4 * s; g.lineCap = 'round';
      g.beginPath(); g.moveTo(px, py); g.quadraticCurveTo(px + 8 * s, py - ph * 0.5, px + 4 * s, py - ph); g.stroke();
      const cx = px + 4 * s, cy = py - ph;
      for (let k = 0; k < 15; k++) {
        const a = -Math.PI * 0.95 + (k / 14) * Math.PI * 1.9 + (rnd() - 0.5) * 0.15;
        const L = (26 + rnd() * 12) * s;
        g.lineWidth = 2.2 * s;
        g.beginPath(); g.moveTo(cx, cy);
        g.quadraticCurveTo(cx + Math.cos(a) * L * 0.6, cy + Math.sin(a) * L * 0.6 - 6 * s, cx + Math.cos(a) * L, cy + Math.sin(a) * L + Math.max(0, Math.cos(a)) * 4 * s);
        g.stroke();
      }
    };
    palm(170, h * 0.93, 210, 1.15); palm(320, h * 0.95, 160, 0.9); palm(760, h * 0.94, 240, 1.25); palm(880, h * 0.96, 150, 0.8);
    g.fillStyle = night ? '#141E30' : '#A9BEA2';
    for (let i = 0; i < 30; i++) { const bx = (i / 29) * w + (rnd() - 0.5) * 30, r = 34 + rnd() * 30; g.beginPath(); g.arc(bx, h * 0.97 + rnd() * 10, r, 0, Math.PI * 2); g.fill(); }
  });
}

const walls = [];
function makeWall(normal, center, stage = false) {
  const plane = new THREE.Plane(new V3(0, -1, 0), 0);

    g, plane, h: 0, stage, n: new V3(...normal), c: new V3(...center),

function wallPiece(w, outline, holes, pos, rotY) {
  const sh = new THREE.Shape(outline.map(([x, y]) => new THREE.Vector2(x, y)));
  for (const h of holes) sh.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
  const geo = new THREE.ExtrudeGeometry(sh, { depth: ROOM.t, bevelEnabled: false });
  for (const material of [w.face, w.cap]) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(...pos);
    m.rotation.y = rotY;
    m.castShadow = m.receiveShadow = material === w.face;
    w.g.add(m);
  }
}

const POT = {
  terracotta: { color: '#C06F4C', rough: 0.92 },

function potProfile(shape, r, h) {
  if (shape === 'taper') return { pts: [[0, 0], [0.76 * r, 0], [0.78 * r, 0.01], [0.93 * r, 0.8 * h], [1.07 * r, 0.8 * h], [1.08 * r, 0.82 * h], [1.08 * r, h], [0.96 * r, h], [0.93 * r, 0.84 * h]], soil: 0.84, rIn: 0.92 };
  if (shape === 'round') return { pts: [[0, 0], [0.58 * r, 0], [0.63 * r, 0.012], [0.9 * r, 0.18 * h], [r, 0.46 * h], [0.97 * r, 0.8 * h], [0.92 * r, h], [0.86 * r, h], [0.87 * r, 0.84 * h]], soil: 0.84, rIn: 0.87 };
  if (shape === 'cyl') return { pts: [[0, 0], [0.95 * r, 0], [r, 0.03 * h], [r, h], [0.92 * r, h], [0.92 * r, 0.88 * h]], soil: 0.88, rIn: 0.92 };
  return { pts: [[0, 0], [0.8 * r, 0], [0.84 * r, 0.02 * h], [r, h], [0.92 * r, h], [0.89 * r, 0.86 * h]], soil: 0.86, rIn: 0.89 };
}
function makePot(spec) {
  const g = new THREE.Group();
  const { r, h } = spec;
  const pr = potProfile(spec.shape, r, h);
  const lift = spec.saucer ? 0.008 : 0;
  const pot = new THREE.Mesh(new THREE.LatheGeometry(pr.pts.map(([x, y]) => new THREE.Vector2(x, y)), 48), mat(POT[spec.color].color, { roughness: POT[spec.color].rough, side: THREE.DoubleSide }));
  pot.position.y = lift;
  pot.castShadow = pot.receiveShadow = true;
  g.add(pot);
  if (spec.saucer) {
    const sp = [[0, 0], [0.86 * r, 0], [0.96 * r, 0.005], [1.12 * r, 0.024], [1.07 * r, 0.026], [0.9 * r, 0.009], [0, 0.009]].map(([x, y]) => new THREE.Vector2(x, y));
    const s = new THREE.Mesh(new THREE.LatheGeometry(sp, 48), mat('#B8694A', { roughness: 0.9, side: THREE.DoubleSide }));
    s.castShadow = s.receiveShadow = true;
    g.add(s);
  }
  const top = lift + pr.soil * h;
  const soilMat = new THREE.MeshStandardMaterial({ map: soilTex, color: spec.soil === 'sandy' ? '#BBA27F' : '#5C4433', roughness: 1 });
  const soil = new THREE.Mesh(new THREE.CircleGeometry(pr.rIn * r, 36), soilMat);
  soil.rotation.x = -Math.PI / 2;
  soil.position.y = top;
  soil.receiveShadow = true;
  g.add(soil);
  if (spec.pebbles) {
    const im = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 5), mat('#CFC8BB', { roughness: 0.9 }), 22);
    const d = new THREE.Object3D(), c = new THREE.Color();
    for (let i = 0; i < 22; i++) {
      const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * pr.rIn * r * 0.9;
      d.position.set(Math.cos(a) * rr, top + 0.002, Math.sin(a) * rr);
      d.rotation.set(0, rnd() * 3, 0);
      const s = 0.006 + rnd() * 0.005;
      d.scale.set(s * 1.3, s * 0.6, s);
      d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
      im.setColorAt(i, c.set(['#D8D2C6', '#BDB4A6', '#E6E1D8'][i % 3]));
    }
    im.receiveShadow = true;
    g.add(im);
  }
  return { group: g, soilMat, top };
}
function makeHanger(L, r, h) {
  const g = new THREE.Group();
  const cm = mat('#E4D7BC', { roughness: 0.95 });
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.0035, 8, 20), mat('#8C8F8A', { metalness: 0.6, roughness: 0.4 }));
  hook.position.y = -0.018;
  g.add(hook);
  const rim = -L, bot = -L - h;
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2 + 0.4, sx = Math.cos(a), sz = Math.sin(a);
    const P = (rr, y) => new V3(sx * rr, y, sz * rr);
    tube(g, [new V3(0, -0.04, 0), P(r * 0.42, -L * 0.5), P(r * 1.07, rim - 0.012), P(r * 1.03, rim - h * 0.46), P(r * 0.62, bot - 0.004), new V3(0, bot - 0.03, 0)], 0.0032, cm, 48, 5);
  }
  const knot = mat('#DCCDAF', { roughness: 1 });
  const k1 = new THREE.Mesh(new THREE.SphereGeometry(0.009, 10, 8), knot); k1.position.y = -0.045; g.add(k1);
  const k2 = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 8), knot); k2.position.y = bot - 0.032; g.add(k2);

  g.add(tassel);

}

function makeSnake() {

const heartProf = (v) => Math.pow(Math.sin(Math.PI * (0.16 + 0.84 * v)), 0.72) * (1 - 0.18 * v);
/* jiboia: coroa de folhas e três ramos que descem pela frente da estante */
const VINES = [
  [[-0.02, 0.02, -0.02], [-0.08, 0.04, -0.05], [-0.13, 0.0, -0.07], [-0.18, -0.09, -0.09], [-0.245, -0.25, -0.1], [-0.285, -0.42, -0.11], [-0.305, -0.58, -0.13], [-0.315, -0.7, -0.15]],
  [[-0.02, 0.02, 0.02], [-0.08, 0.04, 0.05], [-0.13, 0.0, 0.08], [-0.185, -0.1, 0.1], [-0.25, -0.27, 0.12], [-0.29, -0.45, 0.14], [-0.305, -0.6, 0.16]],
  [[0, 0.02, 0.03], [-0.01, 0.045, 0.09], [-0.05, 0.02, 0.17], [-0.11, -0.04, 0.24], [-0.17, -0.14, 0.29], [-0.235, -0.28, 0.32], [-0.285, -0.45, 0.34]]
];
function makePothos() {
  const f = new THREE.Group();
  const leaf = leafGeo(1, 0.4, heartProf, 0.45, 0, 6, 10, 0.22, 0.6);
  const m = new THREE.MeshStandardMaterial({ map: pothosTex, side: THREE.DoubleSide, roughness: 0.42 });
  const list = [], d = new THREE.Object3D();
  for (let i = 0; i < 18; i++) {
    const a = i * 2.39996, r = 0.02 + rnd() * 0.06;
    d.position.set(Math.sin(a) * r, 0.01 + rnd() * 0.07, Math.cos(a) * r);
    d.rotation.set(0.55 + rnd() * 0.85, a, 0, 'YXZ');
    d.scale.setScalar(0.07 + rnd() * 0.035);
    d.updateMatrix();
    list.push(d.matrix.clone());
  }
  const stemM = mat('#5E8E45', { roughness: 0.6 });
  const out = new V3(-1, 0.15, 0).normalize(), Y = new V3(), Z = new V3(), X = new V3(), basis = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new V3();
  VINES.forEach((pts, vi) => {
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => new V3(...p)));
    f.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.0028, 5), stemM));
    const L = curve.getLength(), n = Math.floor(L / 0.044);
    for (let k = 1; k <= n; k++) {
      const t = k / (n + 0.4), side = (k + vi) % 2 ? 1 : -1;
      Y.set(0, -0.55, side * 0.8).addScaledVector(out, 0.35).normalize();
      Z.copy(out).negate().addScaledVector(Y, out.dot(Y)).normalize();
      X.crossVectors(Y, Z);
      basis.makeBasis(X, Y, Z);
      q.setFromRotationMatrix(basis);
      sc.setScalar((0.068 - 0.026 * t) * (0.85 + rnd() * 0.3));
      list.push(new THREE.Matrix4().compose(curve.getPointAt(t), q, sc));
    }
  });
  const im = new THREE.InstancedMesh(leaf, m, list.length);
  list.forEach((mm, i) => im.setMatrixAt(i, mm));
  im.castShadow = im.receiveShadow = true;
  f.add(im);
  return { foliage: f, height: 0.13 };
}
function makeBasil() {
  const f = new THREE.Group();
  const leaf = leafGeo(1, 0.52, (v) => Math.pow(Math.sin(Math.PI * Math.min(1, 0.04 + v)), 0.7) * (1 - 0.25 * v), 0.4, 0, 4, 8, -0.3);
  const m = new THREE.MeshStandardMaterial({ map: basilTex, side: THREE.DoubleSide, roughness: 0.38 });
  const stemM = mat('#5F8C3C', { roughness: 0.65 });
  const d = new THREE.Object3D(), mats = [], cols = [];
  const cDark = new THREE.Color('#255F1C'), cLight = new THREE.Color('#47872D');
  const leafAt = (P, tilt, yaw, size, k) => {
    d.position.copy(P);
    d.rotation.set(tilt, yaw, 0, 'YXZ');
    d.scale.setScalar(size);
    d.updateMatrix();
    mats.push(d.matrix.clone());
    cols.push(cDark.clone().lerp(cLight, k));
  };
  for (let s = 0; s < 9; s++) {
    const a = s * 2.39996 + rnd() * 0.3, r = s === 0 ? 0 : 0.012 + rnd() * 0.026;
    const h = s === 0 ? 0.15 : 0.09 + rnd() * 0.05, lean = s === 0 ? 0.01 : 0.03 + rnd() * 0.04;
    const p0 = new V3(Math.sin(a) * r, 0, Math.cos(a) * r);
    const p2 = new V3(Math.sin(a) * (r + lean), h, Math.cos(a) * (r + lean));
    const curve = new THREE.QuadraticBezierCurve3(p0, new V3(p0.x * 1.1, h * 0.5, p0.z * 1.1), p2);
    const st = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.0024, 5), stemM);
    st.castShadow = true;
    f.add(st);
    for (let k = 0; k < 5; k++) {
      const P = curve.getPoint(0.18 + k * 0.18);
      for (const sgn of [0, Math.PI]) leafAt(P, 1.05 - k * 0.1 + rnd() * 0.15, a + k * Math.PI / 2 + sgn + (rnd() - 0.5) * 0.3, 0.072 - k * 0.007 + rnd() * 0.008, k * 0.12 + rnd() * 0.2);
    }
    for (let k = 0; k < 6; k++) leafAt(p2, 0.3 + (k % 2) * 0.35 + rnd() * 0.15, a + k * 1.05, 0.034 + rnd() * 0.008, 0.95);
  }
  const im = new THREE.InstancedMesh(leaf, m, mats.length);
  mats.forEach((mm, i) => { im.setMatrixAt(i, mm); im.setColorAt(i, cols[i]); });
  im.castShadow = im.receiveShadow = true;
  f.add(im);

function ribbed(curve, r0, prof, ribs, depth, nRing, nAround, cV, cC, areoles) {

      const th = (j / nAround) * Math.PI * 2;
      const crest = 0.5 + 0.5 * Math.cos(ribs * th);
      const k = 1 - depth * Math.pow(1 - crest, 1.4);
      dir.copy(N).multiplyScalar(Math.cos(th)).addScaledVector(B, Math.sin(th));
      pos.push(P.x + dir.x * r * k, P.y + dir.y * r * k, P.z + dir.z * r * k);

    }
  }

    idx.push(a, b, a2, b, b2, a2);

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();

    for (let s = 0.016; s < L - 0.01; s += 0.021) {

function overviewState() {

    fitCam.lookAt(t);

  if (i < 0) return;
  focusPlant(plants[(i + d + plants.length) % plants.length].id, d > 0 ? 'next' : 'prev');
}

/* ---------------- dock e marcadores ---------------- */
const plist = $('#plist');
const dockEls = {}, mkEls = {};
function setHot(id) {
  if (hotId === id) return;
  hotId = id;
  for (const p of plants) {
    dockEls[p.id].classList.toggle('is-hot', p.id === id);
    mkEls[p.id].classList.toggle('is-hot', p.id === id);

}
plants.forEach((p) => {

  li.innerHTML = `<button type="button" class="pbtn" data-id="${p.id}"><span class="pb-top"><span class="dot"></span><span class="pb-name">${esc(p.short)}</span></span><span class="pb-low"><span class="pb-bar"><i></i></span><span class="pb-pct"></span></span></button>`;
  const b = li.firstElementChild;
  b.addEventListener('click', () => focusPlant(p.id));
  b.addEventListener('mouseenter', () => setHot(p.id));
  b.addEventListener('mouseleave', () => setHot(null));
  b.addEventListener('focus', () => setHot(p.id));
  b.addEventListener('blur', () => setHot(null));
  plist.appendChild(li);
  dockEls[p.id] = b;

  const el = document.createElement('div');
  el.className = 'mk is-off';
  el.innerHTML = `<button type="button" class="mk-btn"><span class="mk-dot"></span><span class="mk-label"><span>${esc(p.name)}</span><b></b></span></button>`;
  const mb = el.firstElementChild;
  mb.addEventListener('click', () => focusPlant(p.id));
  mb.addEventListener('mouseenter', () => setHot(p.id));
  mb.addEventListener('mouseleave', () => setHot(null));
  $('#markers').appendChild(el);
  mkEls[p.id] = el;
  refreshPlantUI(p, true);
});
function refreshPlantUI(p, force) {
  const v = Math.round(p.water), st = statusOf(p);
  if (!force && p._v === v && p._st === st) return;
  p._v = v; p._st = st;
  const label = booted ? `${p.name}: ${STATUS[st].toLowerCase()}, água estimada ${v} %` : `${p.name}: carregando`;
  const d = dockEls[p.id];
  d.classList.remove('st-ok', 'st-warn', 'st-water', 'st-none');
  d.classList.add(`st-${st}`);
  d.querySelector('.pb-pct').textContent = booted ? `${v}%` : '…';
  d.querySelector('.pb-bar i').style.width = `${booted ? p.water : 0}%`;
  d.setAttribute('aria-label', label);
  const m = mkEls[p.id];
  m.classList.remove('st-ok', 'st-warn', 'st-water', 'st-none');
  m.classList.add(`st-${st}`);
  m.querySelector('b').textContent = `${v} %`;
  m.firstElementChild.setAttribute('aria-label', label);
  if (selectedId === p.id) {
    const n = $('#s-wnum'), f = $('#s-wfill'), s = $('#s-status'), g = $('#s-gauge');
    if (n) n.textContent = v;
    if (f) f.style.width = `${p.water}%`;
    if (g) g.setAttribute('aria-valuenow', String(v));
    if (s) s.innerHTML = `<span class="dot st-${st}"></span><span>${STATUS[st]}</span>`;
  }
}
const proj = new V3();
function updateMarkers() {
  for (const p of plants) {
    const el = mkEls[p.id];
    proj.copy(p.anchor).project(camera);
    const x = ((proj.x + 1) / 2) * viewW, y = ((1 - proj.y) / 2) * viewH;
    const off = !booted || mode === 'focus' || mode === 'intro' || p.obj.grow < 0.98 || proj.z > 1 || x < -20 || x > viewW + 20 || y < -20 || y > viewH + 20;
    el.classList.toggle('is-off', off);
    el.classList.toggle('flip', x > viewW - 240);
    el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
  }
}

const sheet = $('#sheet');

function rangeText(v, r, unit) {
  if (r[0] == null || r[1] == null) return { ok: true, text: 'Sem faixa ideal cadastrada' };
  if (v < r[0]) return { ok: false, text: `Abaixo do ideal (${r[0]}–${r[1]} ${unit})` };
  if (v > r[1]) return { ok: false, text: `Acima do ideal (${r[0]}–${r[1]} ${unit})` };
  return { ok: true, text: `Dentro do ideal (${r[0]}–${r[1]} ${unit})` };
}
function logMarkup(p) {
  const evs = p.api ? (p.records || []).slice(0, 4).map(eventOf) : p.events.slice(0, 4);
  if (!evs.length) {
    const msg = !p.api ? 'Nenhum registro ainda.' : p.records ? 'Nenhum registro ainda. Use Registrar para a primeira pesagem.' : p.recordsErr ? `Não deu para carregar os registros. ${p.recordsErr}` : 'Carregando…';
    return `<li><span class="ldot" aria-hidden="true"></span><div><p class="l-d">${esc(msg)}</p></div></li>`;
  }
  return evs.map((e) => `<li class="ev-${e.type}"><span class="ldot" aria-hidden="true"></span><div><p class="l-t">${esc(e.title)}</p><p class="l-d"><span class="l-when">${esc(e.when)}</span>${e.detail ? ` · ${esc(e.detail)}` : ''}</p>${e.photo ? `<img class="l-photo" src="${e.photo}" alt="Foto anexada à observação">` : ''}</div></li>`).join('');
}
function refreshLog(p) {

}
function climateRows(p) {

  const t = rangeText(CLIMATE.temp, p.temp, '°C'), h = rangeText(CLIMATE.rh, p.rh, '%');

function renderSheet(html, swap, focusAct) {
  sheet.innerHTML = html;
  if (swap && !reduce) {
    const s = $('#s-scroll');
    if (s) s.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
  }
  if (focusAct) { const b = sheet.querySelector(`[data-act="${focusAct}"]`); if (b) b.focus({ preventScroll: true }); }

function openSheet() {
  const wasOpen = sheet.classList.contains('open');
  if (!wasOpen) sheetOpener = document.activeElement;
  sheet.classList.add('open');
  sheet.inert = false;
  app.classList.add('has-sheet');
  updateShift();
  hideHint();
  if (!wasOpen) setTimeout(() => { if (sheet.classList.contains('open') && !sheet.contains(document.activeElement)) sheet.focus({ preventScroll: true }); }, 80);
}
function closeSheet() {
  selectedId = null;
  sheet.classList.remove('open');
  sheet.inert = true;
  app.classList.remove('has-sheet');
  updateShift();
  if (sheetOpener && sheetOpener.isConnected && sheetOpener !== document.body) sheetOpener.focus({ preventScroll: true });

function updateShift() {
  const open = sheet.classList.contains('open');
  const mobile = window.innerWidth <= 720;
  rig.shift.gx = open && !mobile ? (sheet.offsetWidth + 16) / 2 : 0;
  rig.shift.gy = open && mobile ? sheet.offsetHeight / 2 : (!open ? (dockSpace() - TOP_SPACE) / 2 : 0);
  app.style.setProperty('--sheet-w', open && !mobile ? `${sheet.offsetWidth + 32}px` : '0px');
}
sheet.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'close') back();
  else if (a === 'prev') stepPlant(-1);
  else if (a === 'next') stepPlant(1);
  else if (a === 'registro') openReg(byId[selectedId]);
  else if (a === 'irrigar') irrigate(byId[selectedId]);
  else if (a === 'identify') identify(b);
});
async function identify(b) {
  blinkUntil = performance.now() + 3000;
  if (!live.on) { toast('LED do IG-01 piscando', 'Exemplo: só na maquete, sem servidor', 'ok'); return; }
  b.disabled = true;
  try {
    const r = await api(`/api/devices/${encodeURIComponent(DEVICE)}/commands`, { method: 'POST', body: { command: 'identify' } });
    if (r && r.deviceOnline === false) toast('O IG-01 está offline', 'O comando não chega à placa agora', 'warn');
    else toast('LED do IG-01 piscando', 'Use para achar o aparelho certo na sala', 'ok');
  } catch (err) {
    toast('O comando não foi enviado', err.message, 'warn');
  } finally {
    setTimeout(() => { b.disabled = false; }, 1500);
  }
}
function addEvent(p, ev) {
  p.events.unshift(ev);
  refreshLog(p);
}
function animateWater(p, to, ms) { p.waterAnim = { from: p.water, to, t0: performance.now(), dur: reduce ? 1 : ms }; }
async function irrigate(p) {
  if (!canIrrigate(p)) return;
  if (!live.on) { demoIrrigate(p); return; }
  live.irrigating = true;
  const btn = $('#s-irrigar');
  if (btn) btn.disabled = true;
  try {
    const r = await api(plantPath(p, '/irrigations'), { method: 'POST' });
    const d = await api(plantPath(p)).catch(() => null);
    onIrrigated(d || Object.assign({}, p.api, { code: p.id }), r);
  } catch (err) {
    toast('A irrigação não foi registrada', err.message, 'warn');
  } finally {
    live.irrigating = false;
    const b = $('#s-irrigar');
    if (b && b.dataset.act) b.disabled = !canIrrigate(byId[selectedId]);
  }
}

const dlg = $('#reg');
const form = $('#reg-form');
let regPlant = null, regTab = 'pesagem', regAmount = 200, obsPicked = new Set(), obsPhoto = null, saving = false;
const AMOUNTS = [100, 150, 200, 300];
const SIGNS = ['Folhas amareladas', 'Pontas secas', 'Terra seca ao toque', 'Folhas murchas', 'Pragas visíveis', 'Folhas novas'];
const parseNum = (s) => parseFloat(String(s).trim().replace(/\./g, '').replace(',', '.'));
function setRegTab(t) {
  regTab = t;
  dlg.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  dlg.querySelectorAll('[data-pane]').forEach((s) => { s.hidden = s.dataset.pane !== t; });
}
function renderChips() {
  $('#rega-chips').innerHTML = AMOUNTS.map((a) => `<button type="button" class="chip" data-ml="${a}" aria-pressed="${a === regAmount}">${a} mL</button>`).join('');
  $('#obs-chips').innerHTML = SIGNS.map((s) => `<button type="button" class="chip" data-sign="${esc(s)}" aria-pressed="${obsPicked.has(s)}">${esc(s)}</button>`).join('');
}
function updateCompare() {
  const p = regPlant, box = $('#peso-cmp'), d = p.api;
  const w = parseNum($('#peso').value);
  $('#peso-err').hidden = true;
  if (!isFinite(w) || w <= 0) { box.hidden = true; return; }
  box.hidden = false;
  box.className = 'compare';
  if ($('#peso-cheio').checked) {
    box.innerHTML = `<strong>Vira o peso de vaso cheio: ${fmtInt(w)} g</strong><span>As próximas pesagens medem a água pela diferença para este peso.</span>`;
    return;
  }
  /* com o peso de vaso cheio conhecido, a balança diz quanto de água há (1 g = 1 mL) */
  const scale = d && d.fullWeightG != null
    ? ` Pela balança, o vaso está com ${Math.round(clamp((d.waterCapacityMl - (d.fullWeightG - w)) / d.waterCapacityMl, 0, 1) * 100)} % de água.` : '';
  if (p.lastWeight == null) {
    box.innerHTML = `<strong>Primeira pesagem desta planta</strong><span>Ela vira o ponto de partida para comparar com as próximas.${scale}</span>`;
    return;
  }
  if (d && d.wateredSinceWeighing) {
    box.innerHTML = `<strong>Houve rega depois da última pesagem</strong><span>Esta pesagem não compara perdas; vira o novo ponto de partida.${scale}</span>`;
    return;
  }
  const loss = Math.round(p.lastWeight - w), est = Math.round(p.estSince);
  if (loss > 0) {
    const diff = Math.round((Math.abs(loss - est) / loss) * 100);
    box.innerHTML = `<strong>Perdeu ${fmtInt(loss)} g, ou ${fmtInt(loss)} mL de água</strong><span>O sistema estimou ${fmtInt(est)} mL desde a última pesagem · diferença de ${diff} %.${scale}</span>`;
  } else {
    box.className = 'compare warn';
    box.innerHTML = '<strong>O vaso está mais pesado que na última pesagem</strong><span>Se você regou, registre também na aba Rega.</span>';
  }
}
function openReg(p) {

function savedText(p, r) {
  if (r.type === 'weighing') {
    if (r.fullPot) return `${p.name} · peso de vaso cheio guardado`;
    if (r.measuredLossMl > 0) return `Perdeu ${fmtInt(r.measuredLossMl)} mL; o sistema estimou ${fmtInt(r.estimatedLossMl)} mL`;
    return `${p.name} · pesagem`;
  }
  if (r.type === 'watering') return `${p.name} · rega de ${fmtInt(r.waterMl)} mL`;
  return `${p.name} · observação`;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = regPlant;
  if (!p || saving) return;
  $('#reg-err').hidden = true;
  let body;
  if (regTab === 'pesagem') {
    const w = parseNum($('#peso').value);
    if (!isFinite(w) || w <= 0) { $('#peso-err').hidden = false; $('#peso').focus(); return; }
    body = { type: 'weighing', weightGrams: w, fullPot: $('#peso-cheio').checked };
  } else if (regTab === 'rega') {
    if (!(regAmount >= 1 && regAmount <= 5000)) { showRegErr('A quantidade de água deve ficar entre 1 e 5.000 mL.'); return; }
    body = { type: 'watering', waterMl: regAmount, drained: $('#rega-esc').checked };
  } else {
    const note = [...obsPicked, $('#obs-text').value.trim()].filter(Boolean).join(' · ');
    if (live.on && !note) { showRegErr('Escolha um dos sinais ou escreva uma anotação.'); return; }
    if (note.length > 500) { showRegErr('A anotação pode ter até 500 caracteres.'); return; }
    body = { type: 'observation', note };
  }
  if (!live.on) { demoRecord(p, body); return; }
  setSaving(true);
  try {
    const r = await api(plantPath(p, '/records'), { method: 'POST', body });
    const d = await api(plantPath(p)).catch(() => null);
    if (d) applyApi(p, d);
    addRecord(p, r);
    if (r.type === 'watering') p.obj.wet = Math.max(p.obj.wet, 0.8);
    closeReg();
    toast('Registro salvo', savedText(p, r), 'ok');
  } catch (err) {
    showRegErr(err.message);
  } finally {
    setSaving(false);
  }
});
/* sem servidor: o registro fica só nesta página */
function demoRecord(p, body) {
  if (body.type === 'weighing') {
    const w = body.weightGrams, loss = Math.round(p.lastWeight - w);
    const detail = body.fullPot ? 'vaso cheio, virou a referência' : loss > 0 ? `perdeu ${fmtInt(loss)} mL, o sistema estimou ${p.estSince} mL` : 'mais pesado que na última pesagem';
    addEvent(p, { type: 'pesagem', title: `Pesagem: ${fmtInt(w)} g`, detail, when: 'agora' });
    p.lastWeight = w;
    p.estSince = 0;
    if (body.fullPot) animateWater(p, 100, 1200);
  } else if (body.type === 'watering') {
    addEvent(p, { type: 'rega', title: `Rega: ${body.waterMl} mL`, detail: body.drained ? 'escorrida, pratinho vazio' : 'sem confirmar o escoamento', when: 'agora' });
    animateWater(p, Math.min(100, p.water + (body.waterMl / p.recommend) * (100 - p.limit)), 1200);
    p.obj.wet = Math.max(p.obj.wet, 0.8);
  } else {
    addEvent(p, { type: 'obs', title: 'Observação', detail: body.note || 'sem detalhes', when: 'agora', photo: obsPhoto });
  }
  closeReg();
  toast('Registro salvo', `${p.name} · exemplo, não vai para o servidor`, 'ok');
}


/* ---------------- entrada: arrastar, pinça, roda, clique ---------------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const visibleChain = (o) => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
function pick(x, y) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const list = [plantRoot];
  if (wBack.h > 1.7) list.push(sensor);
  for (const h of raycaster.intersectObjects(list, true)) if (visibleChain(h.object)) return h;
  return null;
}
function rotateBy(dx, dy) {
  if (rig.flight || mode === 'intro') return;
  const g = rig.goal;
  if (mode === 'inside') {
    const k = 0.0042 * (g.fov / 58);
    g.yaw += dx * k;
    g.pitch -= dy * k;
  } else {
    g.yaw -= dx * 0.0055;
    g.pitch += dy * 0.0055;
  }
  applyLimits();
}
function zoomBy(f) {
  if (rig.flight || mode === 'intro') return;
  if (mode === 'inside') rig.goal.fov *= f; else rig.goal.dist *= f;
  applyLimits();
}
function onTap(x, y) {
  if (mode === 'intro') return;
  const hit = pick(x, y);
  const ud = hit ? hit.object.userData : {};
  if (ud.plantId) focusPlant(ud.plantId);
  else if (ud.sensor) focusSensor();
  else if (mode === 'focus') back();
}
const ptrs = new Map();
let gesture = null;
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) gesture = { moved: 0, multi: false };
  else if (gesture) gesture.multi = true;
  if (performance.now() - hintShownAt > 900) hideHint();
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) { queueHover(e.clientX, e.clientY); return; }
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const before = Math.hypot(a.x - b.x, a.y - b.y);
    p.x = e.clientX; p.y = e.clientY;
    const after = Math.hypot(a.x - b.x, a.y - b.y);
    if (before > 10 && after > 10) zoomBy(before / after);
    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (!gesture || gesture.multi) return;
  gesture.moved += Math.abs(dx) + Math.abs(dy);
  if (gesture.moved > 6) {
    canvas.classList.add('is-drag');
    rotateBy(dx, dy);
  }
});
function endPointer(e, cancelled) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size > 0) return;
  canvas.classList.remove('is-drag');
  const g = gesture;
  gesture = null;
  if (!cancelled && g && !g.multi && g.moved <= 8) onTap(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', (e) => endPointer(e, false));
canvas.addEventListener('pointercancel', (e) => endPointer(e, true));
canvas.addEventListener('lostpointercapture', (e) => endPointer(e, true));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomBy(Math.exp(clamp(dy, -120, 120) * 0.0012));
}, { passive: false });
let hoverQ = null;
function queueHover(x, y) {
  const pending = hoverQ;
  hoverQ = { x, y };
  if (pending) return;
  requestAnimationFrame(() => {
    const q = hoverQ;
    hoverQ = null;
    if (!q || ptrs.size) return;
    const hit = pick(q.x, q.y);
    const ud = hit ? hit.object.userData : {};
    setHot(ud.plantId && mode !== 'focus' ? ud.plantId : null);
    canvas.classList.toggle('is-over', !!(ud.plantId || ud.sensor));
  });
}
canvas.addEventListener('pointerleave', () => { if (!ptrs.size) { setHot(null); canvas.classList.remove('is-over'); } });
/* "Maquete" também serve para recentralizar: se você girou ou aproximou, volta à vista inicial */
$('#v-model').addEventListener('click', () => { if (mode !== 'intro') goOverview(); });
$('#v-inside').addEventListener('click', () => { if (mode !== 'inside') goInside(); });
$('#sensor-btn').addEventListener('click', focusSensor);
document.addEventListener('keydown', (e) => {
  if (dlg.open || e.target.closest('input, textarea')) return;
  if (e.key === 'Escape') {
    if (mode === 'focus') back();
    else if (mode === 'inside') goOverview();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (mode === 'focus' && selectedId && selectedId !== 'sensor') { e.preventDefault(); stepPlant(d); }
    else if (mode === 'inside' && !rig.flight) { e.preventDefault(); rig.goal.yaw += d * 0.4; applyLimits(); }
  }
});

/* ---------------- loop ---------------- */
let blinkUntil = 0, ledOnUntil = 0;
const wetColor = new THREE.Color('#24170F');
const tmp = new V3();
function updateWalls(dt, t) {
  const rate = t < 3.4 ? 2.4 : 9;
  const k = reduce ? 1 : 1 - Math.exp(-dt * rate);
  for (const w of walls) {
    const outside = !w.stage && tmp.copy(camera.position).sub(w.c).dot(w.n) > 0;
    w.h += ((outside ? CUT : FULL) - w.h) * k;
    w.plane.constant = w.h;
  }
  air.visible = wRight.h > 2.4;
}
function updatePlants(t, dt, now) {
  for (const p of plants) {
    const o = p.obj;
    if (o.grow < 1) {
      o.grow = clamp((t - o.delay) / 0.8, 0, 1);
      o.inner.scale.setScalar(Math.max(0.001, easeBack(o.grow)));
    }
    if (!reduce) {
      o.foliage.rotation.z = Math.sin(t * 0.9 + o.phase) * 0.026;
      o.foliage.rotation.x = Math.cos(t * 0.7 + o.phase) * 0.018;
      if (o.hang) { o.inner.rotation.z = Math.sin(t * 0.55 + o.phase) * 0.012; o.inner.rotation.x = Math.cos(t * 0.43 + o.phase) * 0.008; }
    }
    if (o.wet > 0) {
      o.wet = Math.max(0, o.wet - dt * 0.07);
      o.soilMat.color.copy(o.soilBase).lerp(wetColor, Math.min(1, o.wet * 1.4));
    }
    if (p.waterAnim) {
      const a = p.waterAnim, k = clamp((now - a.t0) / a.dur, 0, 1);
      p.water = a.from + (a.to - a.from) * easeIO(k);
      if (k >= 1) { p.water = a.to; p.waterAnim = null; }
      refreshPlantUI(p);
      if (selectedId === p.id) { const f = $('#s-wfill'); if (f) f.style.width = `${p.water}%`; }
    }
  }
}
function updateRing(dt) {
  let id = selectedId && selectedId !== 'sensor' ? selectedId : (mode === 'focus' ? null : hotId);
  if (id && byId[id].obj.hang) id = null;
  if (id && id !== ringState.id) {
    const p = byId[id];
    ring.position.set(p.base.x, p.ringY, p.base.z);
    ringState.scale = p.obj.r * 1.6;
    ring.scale.setScalar(ringState.scale * 0.7);
    ringState.id = id;
  }
  const goalO = id ? (id === selectedId ? 0.55 : 0.32) : 0;
  const a = reduce ? 1 : 1 - Math.exp(-dt * 10);
  ring.material.opacity += (goalO - ring.material.opacity) * a;
  if (ringState.id) ring.scale.setScalar(ring.scale.x + (ringState.scale - ring.scale.x) * a);
  ring.visible = ring.material.opacity > 0.01;
  if (!id && !ring.visible) ringState.id = null;
}
function updateParticles(dt, now) {
  const p = rain && rain.p;
  for (let i = 0; i < DROPS; i++) {
    const j = i * 3;
    if (dropPos[j + 1] > -10) {
      dropVel[i] -= 5 * dt;
      dropPos[j + 1] += dropVel[i] * dt;
      const floorY = p ? p.base.y + p.obj.potTop : 0;
      if (dropPos[j + 1] < floorY) dropPos[j + 1] = -50;
    } else if (p && now < rain.until && rnd() < 0.2) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * p.obj.r * 0.8;
      dropPos[j] = p.base.x + Math.cos(a) * r;
      dropPos[j + 1] = p.base.y + p.obj.potTop + 0.45 + rnd() * 0.25;
      dropPos[j + 2] = p.base.z + Math.sin(a) * r;
      dropVel[i] = -0.6 - rnd() * 0.6;
    }
  }
  if (rain && now > rain.until + 900) {
    rain = null;
    const b = $('#s-irrigar');
    if (b && b.dataset.act) b.disabled = !canIrrigate(byId[selectedId]);
  }
  dropGeo.attributes.position.needsUpdate = true;
  if (!reduce && air.visible) {
    for (let i = 0; i < AIR; i++) {
      airPos[i * 3] -= 0.22 * dt;
      airPos[i * 3 + 1] -= 0.07 * dt;
      if (airPos[i * 3] < IN.x1 - 1.35) spawnAir(i, false);
    }
    airGeo.attributes.position.needsUpdate = true;
  }
}
function updateLED(t, now) {
  if (now < blinkUntil) ledMat.emissiveIntensity = Math.floor(t * 9) % 2 ? 4 : 0.05;
  else if (now < ledOnUntil) ledMat.emissiveIntensity = 4; /* irrigação: aceso direto, como o LED da placa */
  else ledMat.emissiveIntensity = reduce ? 1.5 : 1.1 + Math.sin(t * 3) * 0.6;
}
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  const dark = cs.getPropertyValue('--is-dark').trim() === '1';
  /* modo escuro = noite: luar fraco pela janela e a luz do teto acesa */
  hemi.intensity = dark ? 0.16 : 0.45;
  setEnv(dark ? 0.1 : 0.3);
  hemi.color.set(dark ? '#AFC0E0' : '#FFFFFF');
  sun.intensity = dark ? 0.45 : 3.4;
  sun.color.set(dark ? '#9DB4E8' : '#FFF0D8');
  fill.intensity = dark ? 0.1 : 0.5;
  skyLight.intensity = dark ? 0.6 : 2.2;
  skyLight.color.set(dark ? '#7F95C8' : '#E2EEFF');
  lamp.intensity = dark ? 7 : 0;
  plafonMat.emissiveIntensity = dark ? 2.4 : 0.15;
  skyMat.map = dark ? SKY.night : SKY.day;
  skyMat.needsUpdate = true;
  renderer.toneMappingExposure = 1.0;
  for (const m of shadeMats) m.opacity = m.userData.base * (dark ? 1.4 : 1);
  groundMat.opacity = groundMat.userData.base * (dark ? 2.2 : 1);
  ring.material.color.set(cs.getPropertyValue('--ink').trim() || '#15201A');
}
/* a vista lá fora desliza um pouco conforme a câmera anda (paralaxe) */
const winDir = new V3();
function updateWindow() {
  winDir.copy(winC).sub(camera.position);
  const zz = Math.max(0.3, -winDir.z);
  skyMat.map.offset.set(0.19 + clamp(winDir.x / zz, -1.6, 1.6) * 0.1, 0.1 + clamp(winDir.y / zz, -1.6, 1.6) * 0.06);
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  viewW = w; viewH = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  updateShift();
  if (mode === 'overview' && !rig.flight) {
    const st = overviewState();
    rig.lim = LIM.overview(st);
    rig.goal.fov = st.fov;
    rig.goal.dist = clamp(rig.goal.dist, rig.lim.dist[0], rig.lim.dist[1]);
  }
}
new ResizeObserver(resize).observe(canvas);

let started = false, last = performance.now();
const t0 = last;
const perf = { acc: 0, n: 0 };
function adapt(raw, t) {
  if (t < 5 || mode === 'intro' || document.hidden) return;
  perf.acc += raw; perf.n++;
  if (perf.acc < 2) return;
  const avg = perf.acc / perf.n;
  perf.acc = 0; perf.n = 0;
  const pr = renderer.getPixelRatio();
  if (avg > 0.034 && pr > 1) { renderer.setPixelRatio(Math.max(1, pr - 0.5)); resize(); }
}
function tick(now) {
  const raw = Math.max((now - last) / 1000, 0);
  const dt = Math.min(raw, 0.05);
  last = now;
  const t = (now - t0) / 1000;
  if (raw < 0.5) adapt(raw, t);
  stepRig(dt, now);
  updateWalls(dt, t);
  updatePlants(t, dt, now);
  updateRing(dt);
  updateWindow();
  updateParticles(dt, now);
  updateLED(t, now);
  renderer.render(scene, camera);
  updateMarkers();
  if (!started) { started = true; $('#loading').classList.add('done'); }
  requestAnimationFrame(tick);
}

let secs = 0;
setInterval(() => {
  secs++;
  /* exemplo: finge uma leitura a cada 30 s para o "há X s" andar */
  if (booted && !live.on && Date.now() - live.readingAt > READ_EVERY_S * 1000) live.readingAt = Date.now();
  const st = document.getElementById('s-sstatus');
  if (st) st.innerHTML = sensorStatusMarkup();
  if (secs % 30 === 0 && byId[selectedId]) refreshLog(byId[selectedId]);
}, 1000);

readTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

resize();
{
  const ov = overviewState();
  rig.lim = LIM.overview(ov);
  if (reduce) {
    setS(rig.cur, ov); setS(rig.goal, ov);
    setMode('overview');
    showHint('overview');
  } else {
    setS(rig.cur, S(ov.t.clone(), ov.yaw - 0.7, 1.3, ov.dist * 1.25, ov.fov));
    setS(rig.goal, rig.cur);
    setMode('intro');
    fly(ov, 2.8, () => { setMode('overview'); showHint('overview'); });
  }
}
requestAnimationFrame(tick);
boot();
